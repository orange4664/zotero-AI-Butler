name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-ai-butler-xpi
          path: .scaffold/build/*.xpi
          if-no-files-found: error
      - name: Native Zotero regressions (isolated profile, no model API calls)
        run: npm run test:offline
