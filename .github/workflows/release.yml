# Publication is manual; building a tag never posts comments to upstream issues.
name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: .scaffold/build
          if-no-files-found: error
