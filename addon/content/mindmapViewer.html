<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      #frame {
        width: 100%;
        height: 100%;
        border: 0;
      }

      #error {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #d32f2f;
        font-size: 14px;
        padding: 20px;
        text-align: center;
        max-width: 720px;
        line-height: 1.5;
        display: none;
      }
    </style>
    <script>
      (function () {
        const zh = {
          pageTitle: "思维导图",
          frameTitle: "思维导图预览",
          noContent: "未提供思维导图内容。",
          exportDone: "导出完成",
          exportFailed: "导出失败",
          postFailed: "发送思维导图数据失败。",
          exportSavedTitle: "思维导图已导出",
          exportSavedText: "已保存到: {path}",
          errorPrefix: "错误: {message}",
        };
        const en = {
          pageTitle: "Mind Map",
          frameTitle: "Mind map preview",
          noContent: "No mind map content was provided.",
          exportDone: "Export complete",
          exportFailed: "Export failed",
          postFailed: "Failed to send mind map data.",
          exportSavedTitle: "Mind map exported",
          exportSavedText: "Saved to: {path}",
          errorPrefix: "Error: {message}",
        };
        function locale() {
          try {
            if (typeof Zotero !== "undefined" && Zotero.locale)
              return String(Zotero.locale);
          } catch (e) {}
          try {
            if (navigator.language) return navigator.language;
          } catch (e) {}
          return "zh-CN";
        }
        const map = locale().toLowerCase().startsWith("zh") ? zh : en;
        window.aiButlerL10n = function (key) {
          return map[key] || zh[key] || key;
        };
        window.aiButlerL10nArgs = function (key, args) {
          let value = window.aiButlerL10n(key);
          Object.keys(args || {}).forEach((name) => {
            value = value.replaceAll("{" + name + "}", String(args[name]));
          });
          return value;
        };
        document.documentElement.lang = locale().toLowerCase().startsWith("zh")
          ? "zh-CN"
          : "en-US";
      })();
    </script>
  </head>
  <body>
    <iframe id="frame" title=""></iframe>
    <div id="error"></div>

    <script>
      (function () {
        function getArgs() {
          try {
            return (window.arguments && window.arguments[0]) || {};
          } catch (e) {
            return {};
          }
        }

        const args = getArgs();
        document.getElementById("frame").title =
          window.aiButlerL10n("frameTitle");
        const title =
          (args && args.title ? String(args.title) : "") ||
          (window.__aiButlerTitle ? String(window.__aiButlerTitle) : "") ||
          window.aiButlerL10n("pageTitle");
        const markdown =
          (args && args.markdown ? String(args.markdown) : "") ||
          (window.__aiButlerMindmapMarkdown
            ? String(window.__aiButlerMindmapMarkdown)
            : "");
        document.title = title;

        const errorEl = document.getElementById("error");
        const frame = document.getElementById("frame");
        const channelToken = Array.from(
          crypto.getRandomValues(new Uint32Array(4)),
          (value) => value.toString(16).padStart(8, "0"),
        ).join("");
        frame.src = new URL(
          "mindmap.html?mode=viewer#channel=" + channelToken,
          window.location.href,
        ).href;

        if (!markdown) {
          errorEl.style.display = "block";
          errorEl.textContent = window.aiButlerL10n("noContent");
          return;
        }

        const notify = (title, text, type) => {
          try {
            new ztoolkit.ProgressWindow(title, {
              closeOnClick: true,
              closeTime: 3000,
            })
              .createLine({ text, type })
              .show();
          } catch (e) {}
        };

        const saveExport = async (payload) => {
          const onExport = args.onExport || window.__aiButlerOnExport;
          if (typeof onExport !== "function")
            throw new Error("Export is unavailable");
          const filePath = await onExport(payload);

          notify(
            window.aiButlerL10n("exportSavedTitle"),
            window.aiButlerL10nArgs("exportSavedText", { path: filePath }),
            "success",
          );
        };

        window.addEventListener("message", (event) => {
          if (event.source !== null && event.source !== frame.contentWindow)
            return;
          if (event.data?.channelToken !== channelToken) return;
          try {
            if (frame.contentWindow.location.href !== frame.src) return;
          } catch {
            return;
          }
          if (!event.data || typeof event.data !== "object") return;

          if (event.data.type === "mindmap-ready") {
            try {
              frame.contentWindow.postMessage(
                { type: "render-mindmap", markdown, channelToken },
                "*",
              );
            } catch (e) {
              errorEl.style.display = "block";
              errorEl.textContent = window.aiButlerL10n("postFailed");
            }
          }

          if (event.data.type === "export-mindmap") {
            saveExport(event.data).catch((e) => {
              notify(
                window.aiButlerL10n("exportFailed"),
                window.aiButlerL10nArgs("errorPrefix", { message: e }),
                "error",
              );
            });
          }
        });

        // Fallback: if the iframe is already loaded and ready message is missed
        frame.addEventListener("load", () => {
          setTimeout(() => {
            try {
              frame.contentWindow.postMessage(
                { type: "render-mindmap", markdown, channelToken },
                "*",
              );
            } catch (e) {}
          }, 500);
        });

        window.addEventListener(
          "keydown",
          (e) => {
            if (e.key === "Escape") {
              try {
                window.close();
              } catch (err) {}
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
